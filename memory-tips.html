<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>覚えるヒント一覧 | Word Master</title>
<style>body{margin:0;background:#f5f7fb;color:#191922;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Yu Gothic',sans-serif}main{max-width:900px;margin:auto;padding:32px 24px}a{color:#176ee8;font-size:13px}h1{font-size:28px;letter-spacing:-.8px;margin:24px 0 12px}header p{font-size:14px;color:#636575;line-height:1.8}#tips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:28px}article{padding:22px;background:white;border:1px solid #e6e7ee;border-radius:18px}h2{margin:0 0 12px;color:#176ee8;font-size:24px}article p{margin:0;font-size:14px;line-height:1.9}@media(max-width:600px){#tips{grid-template-columns:1fr}}</style>
<main><a href="index.html">← アプリに戻る</a><header><h1>覚えるヒント <span id="count"></span>語</h1><p>４択クイズで、この単語に正解すると表示されるヒントの一覧です。<br>現在は覚え方・使い方を掲載しています。語源の説明はまだ追加していません。</p></header><section id="tips"></section></main>
<script src="qc-feedback.js"></script>
<script>document.getElementById('count').textContent=Object.keys(wordMemoryTips).length;for(const [word,tip] of Object.entries(wordMemoryTips).sort(([a],[b])=>a.localeCompare(b))){const card=document.createElement('article'),title=document.createElement('h2'),text=document.createElement('p');title.textContent=word;text.textContent=tip;card.append(title,text);document.getElementById('tips').append(card);}</script>
</html>
