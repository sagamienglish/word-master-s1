<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>相棒ボスチャレンジ</title><link rel="stylesheet" href="boss-battle-demo.css?v=6"></head><body><main><header><h1>ボスチャレンジ</h1><p>デモ · 学習記録には影響しません</p></header><div class="audio-bar"><button id="music-toggle" onclick="toggleMusic()" aria-pressed="false">BGM オフ</button><label>音量 <input id="music-volume" type="range" min="0" max="100" value="25" oninput="setVolume(this.value)"></label><span id="music-status" aria-live="polite"></span></div><audio id="bgm" loop preload="metadata"></audio><section id="stage" class="stage"><div class="stats left"><strong>ブルードラゴン</strong><div class="hp"><i id="ally-hp"></i></div><small id="ally-label"></small></div><div class="stats right"><strong id="boss-name">石竜ガルド</strong><div class="hp"><i id="boss-hp"></i></div><small id="boss-label"></small></div><div id="ally" class="ally"><img src="assets/buddy-blue-dragon.png" alt="ブルードラゴン"></div><img id="boss" class="boss" src="assets/boss-stone-dragon-anime.png" alt="石竜ガルド"><section id="question" class="question"><div class="top"><b id="counter"></b><div id="timer" role="progressbar" aria-label="残り時間" aria-valuemin="0" aria-valuemax="35"><i id="time-fill"></i><span id="time-status"></span></div></div><p id="sentence"></p><p id="translation"></p><small id="count"></small><div id="slots" aria-label="解答の文字" role="group"></div><p id="feedback" aria-live="polite"></p><div class="controls"><button id="hint" onclick="hint()"></button><button id="giveup" onclick="hurt('ギブアップ')">ギブアップ</button></div></section></section><section class="keyboard"><div id="keys"></div><div class="actions"><button id="delete" onclick="erase()">⌫ １文字消す</button><button id="submit" onclick="check()">攻撃する ↵</button></div></section></main><div id="selection" class="result" role="dialog" aria-modal="true" aria-labelledby="selection-title"><div><h2 id="selection-title">ボスチャレンジ</h2><p>相棒と一緒に、今日のボスに挑もう。</p><button id="start-battle" onclick="startBattle()">スタート</button><p>開始するとBGMが流れます。音量は25%です。</p></div></div><div id="result" class="result hidden" role="dialog" aria-modal="true" aria-labelledby="result-title"><div><h2 id="result-title"></h2><p id="result-text"></p><strong id="reward"></strong><p>デモのため経験値は実際には加算されません。</p><button onclick="chooseAgain()">もう一度挑戦</button></div></div><script src="example-data.js"></script><script src="qc-feedback.js?v=20261004-highlight3"></script><script src="boss-battle-demo.js?v=6"></script></body></html>
